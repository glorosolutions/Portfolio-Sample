  </head>

  <body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar scrolled" id="navbar">
      <div class="nav-container">
        <a href="index.html" class="nav-logo">Gloro<span>Solutions</span></a>
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-links" id="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html" class="active">About</a></li>
          <li><a href="skills.html">Skills</a></li>

          <li><a href="experience.html">Experience</a></li>
          <li><a href="contact.html" class="nav-cta">Contact</a></li>
        </ul>
      </div>
    </nav>

    <!-- ===== ABOUT ===== -->
    <section class="section page-section" id="about">
      <div class="container">
        <div class="section-header">
          <span class="section-tag">About Me</span>
          <h2 class="section-title">Who I Am</h2>
        </div>
        <div class="about-grid">
          <div class="about-text">
            <p></p>
            <p></p>
            <div class="about-stats"></div>
            <a href="assets/docs/resume.pdf" class="btn btn-primary" download
              >Download Resume</a
            >
          </div>
          <div class="about-info">
            <div class="info-card"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
      <div class="footer-container">
        <div class="footer-top">
          <div class="footer-brand">
            <a href="index.html" class="nav-logo"></a>
            <p></p>
          </div>
          <div class="footer-links">
            <h4>Quick Links</h4>
            <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="about.html">About</a></li>
              <li><a href="skills.html">Skills</a></li>

          <div class="footer-socials"></div>
        </div>
      </div>
    </footer>

    <a
      href="#about"
      class="back-to-top"
      id="backToTop"
      aria-label="Back to top"
    >
      <i class="bx bx-chevron-up"></i>
    </a>

    <script src="assets/js/data.js"></script>
    <script>
      const hamburger = document.getElementById("hamburger");
      const navLinks = document.getElementById("nav-links");
      hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("open");
        navLinks.classList.toggle("open");
      });
      navLinks.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          hamburger.classList.remove("open");
          navLinks.classList.remove("open");
        });
      });

      const backBtn = document.getElementById("backToTop");
      window.addEventListener("scroll", () => {
        backBtn.classList.toggle("visible", window.scrollY > 200);
      });

      // Fade-in on load
      const fadeObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) entry.target.classList.add("visible");
          });
        },
        { threshold: 0.1 },
      );
      document.querySelectorAll(".about-text, .about-info").forEach((el) => {
        el.classList.add("fade-in");
        fadeObserver.observe(el);
      });
    </script>
  </body>
</html>
